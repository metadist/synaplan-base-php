; ============================================================================
; synaplan-base-php :: 21-arm64.ini
; ----------------------------------------------------------------------------
; Installed only into the linux/arm64 image (uname -m = aarch64).
; amd64 keeps opcache.huge_code_pages=1 from 20-synaplan-opcache.ini.
;
; Remapping the PHP binary's code onto huge pages drops the Branch Target
; Identification landing pads. On arm64 hosts with BTI (Apple Silicon under
; Docker/Colima, arm64 Linux VMs) a few percent of PHP CLI starts then die
; with SIGILL inside php_module_startup. Measured 5/150 with the setting on
; and 0/150 with it off. That crash during migration bootstrap made the
; schema state unreadable.
;
; Loaded after 20-synaplan-opcache.ini, so this value wins.
; https://github.com/metadist/synaplan-base-php/issues/17
; ============================================================================

opcache.huge_code_pages = 0
