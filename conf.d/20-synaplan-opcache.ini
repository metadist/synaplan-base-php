; ============================================================================
; synaplan-base-php :: 20-opcache.ini
; ----------------------------------------------------------------------------
; OPcache + PHP 8.5 tracing JIT, sized for the medium node profile
; (8 cores / 8GB RAM available to PHP). Symfony 8 + API Platform + plugins
; ship around 25-30k vendor classes; the limits below comfortably absorb that
; with headroom for in-cache plugin classes and cluster-wide deploys.
;
; validate_timestamps=0 + revalidate_freq=0 require a container restart on
; deploy. The dev override (APP_ENV=dev) flips both back on so live-reload
; works for OSS contributors.
; ============================================================================

opcache.enable                        = 1
opcache.enable_cli                    = 1
opcache.memory_consumption            = 384
opcache.interned_strings_buffer       = 32
opcache.max_accelerated_files         = 30000
opcache.max_wasted_percentage         = 10
opcache.validate_timestamps           = 0
opcache.revalidate_freq               = 0
opcache.save_comments                 = 1
opcache.fast_shutdown                 = 1
opcache.huge_code_pages               = 1
opcache.file_cache                    = /tmp/opcache
opcache.file_cache_consistency_checks = 1

; PHP 8.5 tracing JIT (15-30% throughput on JSON serialization, validation,
; ORM hydration). Buffer is carved out of memory_consumption above.
opcache.jit                           = tracing
opcache.jit_buffer_size               = 128M
opcache.jit_max_root_traces           = 1024
opcache.jit_max_side_traces           = 128
opcache.jit_max_exit_counters         = 8192
opcache.jit_hot_loop                  = 64
opcache.jit_hot_func                  = 127

; opcache.preload is left UNSET on purpose. Downstream apps opt in by setting
; PHP_OPCACHE_PRELOAD=/path/to/preload.php; the configure shim then renders
; the preload directive into 99-synaplan-env.ini.
