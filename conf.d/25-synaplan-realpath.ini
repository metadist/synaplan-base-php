; ============================================================================
; synaplan-base-php :: 25-realpath.ini
; ----------------------------------------------------------------------------
; Symfony resolves thousands of paths per request (services, bundles, plugin
; autoloader, twig templates, translations). The PHP defaults (16k cache,
; 120s TTL) discard stat() results constantly; bumping to 4M / 600s removes
; that as a hot-path bottleneck.
; ============================================================================

realpath_cache_size = 4096k
realpath_cache_ttl  = 600
