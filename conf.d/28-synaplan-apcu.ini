; ============================================================================
; synaplan-base-php :: 28-apcu.ini
; ----------------------------------------------------------------------------
; APCu in-process userland cache. Symfony's cache.adapter.apcu is a 5-15%
; throughput win on hot config / translator / router / Doctrine metadata
; lookups. enable_cli=1 so messenger:consume workers also benefit.
;
; Size is intentionally modest (64M) — APCu is per-process memory; in
; FrankenPHP worker mode each worker shares the same SHM segment via mmap.
; ============================================================================

apc.enabled    = 1
apc.enable_cli = 1
apc.shm_size   = 64M
apc.ttl        = 7200
apc.gc_ttl     = 3600
