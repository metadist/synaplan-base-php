; ============================================================================
; synaplan-base-php :: 40-security.ini
; ----------------------------------------------------------------------------
; Runtime hardening. Note: the Synaplan API authenticates via X-API-Key
; bearer tokens (BAPIKEYS table), not PHP sessions. The session.* hardening
; below protects any incidental session usage (Symfony flash messages, OAuth
; state cookies for OIDC) and survives an accidental future addition of
; session-based auth.
;
; disable_functions is left empty — synaplan calls whisper / ffmpeg via
; Symfony Process which uses proc_open(); blocking it breaks transcription.
; ============================================================================

; URL wrappers
allow_url_fopen   = On
allow_url_include = Off

; No runtime extension loading.
enable_dl         = Off

; Empty: synaplan needs proc_open via Symfony\Component\Process\Process.
disable_functions =

; ----------------------------------------------------------------------------
; Session module hardening (defense-in-depth for any flash / OAuth cookies).
; ----------------------------------------------------------------------------
; NOTE: session.sid_length and session.sid_bits_per_character are deprecated
; in PHP 8.4 (slated for removal in PHP 9). The post-deprecation defaults
; (32 chars / 4 bits-per-char = 128 bits of entropy) already exceed the
; OWASP recommendation, so we omit them on purpose.
; ----------------------------------------------------------------------------
; CVE-2026-109619 (stale global state RCE, fixed in PHP 8.5.12) defence in
; depth. The PHP security advisory names these two settings as blocking the
; confirmed exploit paths on unfixed builds; they stay off after the fix as
; hardening because Synaplan uses neither feature:
;  - session upload progress: uploads are API-key authenticated file posts,
;    nothing reads PHP_SESSION_UPLOAD_PROGRESS.
;  - fatal-error backtraces: diagnostics only, at the cost of request-owned
;    state surviving into a later request on the same FrankenPHP worker.
; ----------------------------------------------------------------------------
session.upload_progress.enabled = 0
fatal_error_backtraces          = 0

session.use_strict_mode  = 1
session.use_only_cookies = 1
session.cookie_secure    = 1
session.cookie_httponly  = 1
session.cookie_samesite  = Strict
session.gc_probability   = 1
session.gc_divisor       = 10000
