; ============================================================================
; synaplan-base-php :: 10-runtime.ini
; ----------------------------------------------------------------------------
; Request-level runtime limits. Tuned for Synaplan workloads:
;  - upload caps pinned just under the Cloudflare Business 200MB body cap;
;    raising them above doesn't help, CF rejects first.
;  - long max_execution_time covers 200MB video uploads + multi-second AI
;    inference / RAG retrieval round-trips.
;  - PHP buffers uploads to upload_tmp_dir on disk, so memory_limit is
;    independent of upload size and stays sized for Symfony container
;    hydration + JSON serialization of long chat threads.
;
; Every value here is overridable at runtime via PHP_* environment variables
; rendered into 99-synaplan-env.ini by /usr/local/bin/synaplan-php-configure.
; ============================================================================

memory_limit            = 512M
upload_max_filesize     = 200M
post_max_size           = 220M
max_file_uploads        = 20
max_execution_time      = 300
max_input_time          = 300
max_input_vars          = 5000

upload_tmp_dir          = /var/www/uploads
sys_temp_dir            = /var/www/uploads

date.timezone           = UTC
default_socket_timeout  = 60

output_buffering        = 4096
zlib.output_compression = Off
serialize_precision     = -1

pcre.jit                = 1
pcre.backtrack_limit    = 1000000
