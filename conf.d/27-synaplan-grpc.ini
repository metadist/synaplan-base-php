; ============================================================================
; synaplan-base-php :: 27-grpc.ini
; ----------------------------------------------------------------------------
; The gRPC C extension uses a background poller thread; without fork-support
; it deadlocks under FrankenPHP worker mode and any code path that fork()s.
; epoll1 is the recommended Linux poll strategy (kernel 4.5+).
; Synaplan uses gRPC for the Triton inference client.
; ============================================================================

grpc.enable_fork_support = 1
grpc.poll_strategy       = epoll1
