; ============================================================================
; synaplan-base-php :: 30-errors.ini
; ----------------------------------------------------------------------------
; Production-grade error handling. Errors go to stderr (Docker captures it),
; never to the response body. The dev override (APP_ENV=dev) re-enables
; display_errors so OSS contributors see useful stack traces in the browser.
; ============================================================================

expose_php                          = Off
display_errors                      = Off
display_startup_errors              = Off
log_errors                          = On
error_log                           = /dev/stderr
log_errors_max_len                  = 4096
ignore_repeated_errors              = On
ignore_repeated_source              = Off
html_errors                         = Off

; Remove assert() opcodes entirely in prod (no runtime cost).
zend.assertions                     = -1

; Security: scrub stack-trace argument values to prevent secret leakage.
zend.exception_ignore_args          = 1
zend.exception_string_param_max_len = 15

; Skip BOM/unicode detection on every script include.
zend.detect_unicode                 = 0

; Do not advertise the PHP version in outgoing mail headers.
mail.add_x_header                   = Off
