; ============================================================================
; synaplan-base-php :: dev override (template)
; ----------------------------------------------------------------------------
; Activated by /usr/local/bin/synaplan-php-configure when APP_ENV=dev.
; The configure shim copies this file into
;   /usr/local/etc/php/conf.d/99-synaplan-dev.ini
; so it loads after every other synaplan ini and overrides their prod values.
;
; Production behavior is the default; this file is the *only* APP_ENV-gated
; override. Everything else in conf.d/ is pure prod tuning.
; ============================================================================

; Hot-reload: re-stat .php files every 2s so code edits show up.
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 2

; Turn JIT off in dev: faster cache rebuilds on edits, debugger-friendly,
; and side-step a small class of "different behavior in dev vs prod" issues
; while contributors are iterating.
opcache.jit                 = disable

; Surface errors in the browser/profiler.
display_errors              = On
display_startup_errors      = On

; Re-enable assert() opcodes for active assertions during development.
zend.assertions             = 1

; Useful X-Powered-By header in dev (helps when poking the API directly).
expose_php                  = On
